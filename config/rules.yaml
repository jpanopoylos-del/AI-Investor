# ─────────────────────────────────────────────────────────────
#  RISK RULES — enforced by code, not by the AI.
#  The AI can PROPOSE anything; the engine rejects what breaks these.
#  Change a number here, commit, and the next run uses it.
# ─────────────────────────────────────────────────────────────

starting_cash_eur: 15000           # €1,000 at start + €4,000 on 2026-11-25 + €10,000 on 2026-11-27
start_date: null              # set automatically on the first run

# Position sizing
max_positions: 10             # raised from 8 on 27 Nov 2026 (user): tiny legacy positions were blocking slots
max_position_pct: 0.20        # one position ≤ 20% of portfolio value
min_cash_pct: 0.10            # always keep ≥ 10% in cash
min_trade_eur: 200            # raised from 50 on 27 Nov 2026 (user): keeps the €1 fee ≤0.5%
max_new_buys_per_day: 2

# Exits (as % from the fill price). The AI may choose within these bounds.
default_stop_loss_pct: 0.08
min_stop_loss_pct: 0.03
max_stop_loss_pct: 0.15
default_take_profit_pct: 0.20
max_holding_days: 60          # force-close stale ideas

# Circuit breaker: if the portfolio falls this far below its peak,
# no new buys until it recovers above half that drawdown.
drawdown_halt_pct: 0.20

# Quality filters (applied to every BUY)
min_price: 2.0                          # no penny stocks
min_avg_daily_value: 5000000            # 20-day avg (price × volume), local currency
proposal_max_age_days: 3                # stale proposals expire
min_history_sessions: 10                # a BUY needs this many past sessions of prices
short_history_allowed: [ANT]            # user override (26 Nov 2026): may buy with ≥3 sessions

# Costs — modelled on a typical EU neobroker
fee_flat_eur: 1.00            # per order
fx_fee_pct: 0.0025            # 0.25% extra on non-EUR (USD) trades

# Benchmark: what €1000 would do if you just bought a world ETF on day 1
benchmark_symbol: VWCE.DE

# Discovery: tickers the AI mentions outside universe.txt are added to
# data/discovered.json (if liquid) and screened nightly; dropped after
# this many days without being mentioned again (unless held).
discovery_expiry_days: 60
max_discovered: 40
